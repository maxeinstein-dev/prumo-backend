name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The *.db.test.ts files create a scratch database on this throwaway server and drop it at the end
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:teste@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o cliente Prisma
        run: npx prisma generate

      - name: Checar tipos
        run: npx tsc --noEmit

      - name: Rodar testes
        run: npx vitest run

      - name: Rodar testes com banco no fuso de Sao Paulo
        # The runner is UTC; the month bounds must hold in the users' time zone too
        run: npx vitest run .db.test.ts
        env:
          TZ: America/Sao_Paulo
